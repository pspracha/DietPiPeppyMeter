# Define a softvol (software volume) control layer.
# This allows you to control volume before it hits Peppyalsa and your DAC.
pcm.softvol_master {
  type softvol
  slave.pcm "peppyalsa_output" # Send output to the peppyalsa_output device
  control {
    name "Master" # Name of the volume control in alsamixer
    card 0        # Link this control to your main sound card
  }
}

# Define the pcm.peppyalsa_output device that will use the 'meter' type
# which intercepts audio for the peppyalsa plugin.
pcm.peppyalsa_output {
  type meter
  slave.pcm "hw:0,0" # This tells peppyalsa to intercept audio going to your actual DAC (hw:0,0)
  scopes.0 peppyalsa # Link this to the pcm_scope.peppyalsa definition below
}

# This sets the default ALSA output for applications (like Squeezelite)
# to our softvol_master, which then routes through peppyalsa_output.
pcm.!default {
  type plug
  slave.pcm "softvol_master"
}

# This keeps your default control (mixer) tied to your hardware card 0.
# This should still allow `alsamixer` to control the hardware volume if available.
ctl.!default {
  type hw
  card 0
}

# This is the crucial part that defines the peppyalsa *scope plugin*.
# It tells peppyalsa where to write the meter data (the named pipe).
pcm_scope.peppyalsa {
  type peppyalsa
  decay_ms 400       # Adjust decay time for meters
  meter "/var/tmp/peppyfifo" # Path to the named pipe Peppy Meter will read
  meter_max 100
  meter_show 1
  # spectrum "/home/dietpi/peppyfifo_spectrum" # Uncomment if you also want spectrum data
}
pcm_scope_type.peppyalsa {
        lib /usr/local/lib/libpeppyalsa.so
}
